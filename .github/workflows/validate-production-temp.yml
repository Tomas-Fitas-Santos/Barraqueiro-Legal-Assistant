name: Temporary full production validation

on:
  push:
    branches:
      - fix/validate-production

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validate-production
      - name: Apply known validation fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/tutorials/tutorial-workspace.tsx')
          text = path.read_text()
          text = text.replace('AnalysisTabs, DetalhesTab, EmailEditor', 'AnalysisTabs, EmailEditor')
          text = re.sub(r"^\s*\{tab === 'detalhes' \? <DetalhesTab .*?\} : null\}\n", '', text, flags=re.MULTILINE)
          path.write_text(text)
          PY
      - name: Commit fixes if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/tutorials/tutorial-workspace.tsx
            git commit -m "Fix tutorial analysis tab typecheck [skip ci]"
            git push origin HEAD:fix/validate-production
          fi

  typecheck:
    needs: autofix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validate-production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    needs: autofix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validate-production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  tests:
    needs: autofix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validate-production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:fast

  docker-build:
    needs: autofix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validate-production
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: legal-assistant:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
