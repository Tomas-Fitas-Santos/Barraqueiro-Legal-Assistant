# Manual-only by policy (see ci.yml). Releasing is a decision:
#   gh workflow run "Publish Legal Assistant Image" --ref main
name: Publish Legal Assistant Image

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/natenai/legal-assistant:latest
            ghcr.io/natenai/legal-assistant:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
